[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rslaa"
version = "0.1.0"
description = "Self-reconfiguring roadside LiDARs as agents for 3D traffic perception"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RSLaA Authors" }]
keywords = [
  "roadside LiDAR",
  "cooperative perception",
  "sensor placement",
  "multi-agent reinforcement learning",
  "MPC",
  "autonomous driving",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "open3d>=0.17",
  "h5py>=3.8",
  "torch>=2.0",
  "xgboost>=2.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/<your-org>/RSLaA"
Paper = "https://arxiv.org/abs/<to-be-added>"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
